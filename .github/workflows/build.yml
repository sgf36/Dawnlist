name: Build

# Every artefact the launch needs, from one push.
#
# THIS IS THE ANSWER TO "macOS CANNOT BE BUILT FROM SPENCER'S MACHINE".
# It cannot — PyInstaller does not cross-compile — but it does not have to be
# built there. `macos-latest` is a real Mac, and Easy-Post Desktop has shipped
# to both the Mac App Store and Developer ID this way since August 2026. This
# workflow is modelled on that one, including the lessons its comments record.
#
# NOTHING SIGNS OFF master, AND THAT IS A SECURITY PROPERTY RATHER THAN
# TIDINESS. A workflow_dispatch can be started from ANY branch by anyone who
# can push one, and this file used to gate signing on "is this a pull request"
# alone. So a branch could be dispatched, signed with the Developer ID
# certificate, and — once the `mas` job below existed — uploaded to App Store
# Connect as a Dawnlist build. Every step that touches a signing identity, a
# notarisation credential or App Store Connect therefore also tests
# `github.ref == 'refs/heads/master'`, and tests/test_release_workflow.py
# evaluates those conditions for a manual run from a branch.
#
# macOS SHIPS THROUGH THE MAC APP STORE ONLY, by Spencer's decision of
# 2026-09-08, and this file used to say the opposite of itself two paragraphs
# running. The direct .dmg leg still BUILDS on every push, because the bundle
# guards are worth running and the Mac App Store package comes off the same
# spec — but it no longer signs with the Developer ID certificate and spends a
# notarisation round trip to produce a file nobody publishes. Ask for one with
# the `macos_direct` input.
#
# WHY THE MATRIX LISTS VARIANTS AND NOT JUST OPERATING SYSTEMS
# ------------------------------------------------------------
# It used to be `os: [windows-latest, macos-latest]` with the variant chosen
# per OS, which meant one run produced ONE package per platform. Windows built
# the Store MSIX and nothing else, so the Windows direct download did not
# exist — and nothing failed, because nothing was looking for it.
#
# WHAT THIS DELIBERATELY DOES NOT DO: duplicate the packaging logic in YAML.
# Signing, notarising and the bundle guards live in the packaging scripts, so
# they can be read, reviewed and run by hand. A workflow that reimplements them
# in bash is a second source of truth that drifts, and it can only be tested by
# pushing.
#
# EVERY ACTION IS PINNED TO A COMMIT SHA, with its tag in the comment beside
# it. A tag is a mutable pointer: `azure/login@v2` and
# `azure/artifact-signing-action@v2` run in a job holding an OIDC token and the
# signing profile, so a retagged release would run there with nothing changed
# here and nothing to see in a diff. Dependabot moves the pins.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos_direct:
        description: "Also sign and notarise the direct-download macOS .dmg"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # The suite runs headless HERE AND ON A DEVELOPER'S MACHINE, deliberately.
  # A fixture drawn by Qt behaves differently where there is a display, and
  # tests/test_extract.py duly failed in CI for weeks while passing locally —
  # long enough for a red result to become scenery. One platform everywhere is
  # what stops that being rediscovered.
  QT_QPA_PLATFORM: offscreen

jobs:
  # The Worker is half the product — caps, entitlement and the Paddle webhook
  # all live there — and its tests were not run by CI at all. A cap regression
  # would have reached production with a green build.
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          # 22 resolves to the latest 22.x, and that is a floor rather than a
          # preference: test/d1.mjs imports node:sqlite, which arrived in
          # 22.13. Lowering this makes every Worker test fail on an import.
          node-version: "22"
      # An explicit glob, not the directory. `node --test test/` collects
      # nothing and still exits reporting one failed "test", which reads like a
      # real failure and is not one.
      - name: Run the Worker tests
        working-directory: server/dawnlist-feed-worker
        run: node --test test/*.test.mjs

  # Two checks that need no build, and so must not wait behind one.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Install the audit tool
        run: pip install --require-hashes -r requirements-audit.lock.txt

      # The repository is PUBLIC and its history is public with it, so a
      # redacted value that has come back is not something a later commit can
      # undo. Cheap on every push; impossible to fix afterwards.
      - name: Nothing redacted has come back
        run: python tools/scrub_for_public.py --check

      # Audits the LOCKS rather than an installed environment, so it covers the
      # macOS-only and Linux-only packages this runner never installs. It exits
      # non-zero on a known vulnerability, which is the point of running it.
      - name: Known vulnerabilities in what CI installs
        run: |
          pip-audit --require-hashes --desc \
            -r requirements.lock.txt \
            -r requirements-dev.lock.txt \
            -r requirements-audit.lock.txt

  # The app is developed on 3.14 and frozen on 3.12, so the suite passing on
  # one says nothing about the other — and only 3.12 was ever run here. Tests
  # only: nothing about the packaged interpreter changes.
  tests-3-14:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.lock.txt
      - name: Run tests
        run: python -m pytest -q

  build:
    # The Worker tests take under a minute and cover half the product. Signing
    # a client against a Worker whose tests fail is work spent on an artefact
    # nobody should publish.
    needs: worker
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            variant: store        # Microsoft Store  -> dist/Dawnlist.msix
          - os: windows-latest
            variant: direct       # Website download -> dist/Dawnlist-windows-*.zip
          - os: macos-latest
            variant: direct       # Bundle guards, and a .dmg only on request
    runs-on: ${{ matrix.os }}
    # GitHub's default is six hours, which is far longer than anything here
    # should legitimately take.
    timeout-minutes: 60

    permissions:
      contents: read
      id-token: write   # OIDC federated-credential exchange for azure/login

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      # The LOCK, not the floors. An unpinned install resolves whatever PyPI
      # offers that minute, in a job that goes on to hold a signing identity,
      # and two runners on one commit can install different code.
      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.lock.txt

      # Tests first. A package built from code that does not pass its own
      # tests is not worth signing.
      - name: Run tests
        run: python -m pytest -q

      # A branch build produces the same file names as a release and is not
      # one. `dawnlist-windows-latest-store` downloaded from the wrong run is
      # indistinguishable from the release it is not, and the MSIX inside is
      # signed with the same throwaway certificate either way.
      - name: Name this build
        id: label
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "suffix=" >> "$GITHUB_OUTPUT"
          else
            # A pull request's own SHA is the merge commit, which appears in no
            # branch and tells a reader nothing. The head SHA is the commit
            # somebody pushed.
            sha="${{ github.event.pull_request.head.sha || github.sha }}"
            echo "suffix=-${{ github.event_name }}-${sha:0:7}" >> "$GITHUB_OUTPUT"
          fi

      # The flag is baked into the bundle by PyInstaller, so this must happen
      # BEFORE the build and not after. Every packaging script re-checks the
      # bundle rather than trusting this step.
      - name: Select the build variant
        run: python tools/set_build_variant.py ${{ matrix.variant }}

      - name: Build with PyInstaller
        run: python -m PyInstaller packaging/build_exe.spec --noconfirm

      # ---------------------------------------------------------------- macOS
      - name: Import the signing certificate
        if: matrix.os == 'macos-latest' && env.HAS_SIGNING == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && inputs.macos_direct
        env:
          HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          # A throwaway keychain, not the login one. It dies with the runner.
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          # Without this, codesign blocks on a GUI prompt no-one can answer.
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Store the notarisation credentials
        if: matrix.os == 'macos-latest' && env.HAS_NOTARY == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && inputs.macos_direct
        env:
          HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials dawnlist \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"

      # Runs on every push, with or without secrets, and this is why the macOS
      # leg still exists at all. The guards catch a bundle missing its locale
      # catalogues or carrying the wrong variant flag HERE rather than at
      # submission, and the Mac App Store package is built from the same spec.
      - name: Verify the bundle (macOS)
        if: matrix.os == 'macos-latest'
        run: python packaging/build_macos.py --variant ${{ matrix.variant }} --verify-only

      - name: Sign, package and notarise (macOS)
        if: matrix.os == 'macos-latest' && env.HAS_SIGNING == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && inputs.macos_direct
        # Hard ceiling. Apple normally answers in minutes; the sibling project
        # once sat here for 1h58m against a dead runner network.
        timeout-minutes: 45
        env:
          HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          python packaging/build_macos.py --variant direct \
            --identity "$IDENTITY" \
            --notary-profile dawnlist

      # ------------------------------------------------- Windows, Store build
      - name: Build the MSIX
        if: matrix.os == 'windows-latest' && matrix.variant == 'store'
        run: python packaging/build_msix.py

      # Partner Center refuses an unsigned package, and the Store strips this
      # signature and re-signs on publish — so a throwaway certificate is the
      # right instrument, not a shortcut. It carries no release identity and
      # reaches no secret, which is why this step alone is not branch-gated;
      # what keeps a branch package distinguishable is the name it leaves under.
      - name: Sign the MSIX for upload
        if: matrix.os == 'windows-latest' && matrix.variant == 'store'
        shell: pwsh
        run: pwsh -NoProfile -File packaging\sign_msix.ps1

      - name: Mark a non-release MSIX in its own filename
        if: matrix.os == 'windows-latest' && matrix.variant == 'store' && steps.label.outputs.suffix != ''
        shell: bash
        run: mv dist/Dawnlist.msix "dist/Dawnlist${{ steps.label.outputs.suffix }}.msix"

      # ------------------------------------------------ Windows, direct build
      # A real Microsoft-managed Public Trust certificate through Azure
      # Artifact Signing. This is the one buyers meet: a ZIP from the website
      # runs exactly as shipped, so an unsigned executable is a SmartScreen
      # wall for every one of them.
      #
      # No-op until the repo variable AZURE_SIGNING_READY is 'true'. The three
      # AZURE_* repo secrets are directory identifiers, not credentials — the
      # OIDC federated credential is what proves this workflow may use them, so
      # no client secret exists to leak. That credential is bound to a branch
      # subject, so Azure refuses the exchange off master in any case; the
      # condition below states it here too, where a reader can see it.
      #
      # The signing action reads the Azure credential from the CLI session
      # azure/login leaves behind, so the login step is not optional. Account,
      # endpoint and profile are properties of the resource: see Easy-Post
      # Desktop's CI-AZURE-SIGNING-SETUP.md before changing any of the three.
      - name: Azure login (OIDC) for signing
        if: matrix.os == 'windows-latest' && matrix.variant == 'direct' && vars.AZURE_SIGNING_READY == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6  # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the Windows build (Azure Artifact Signing)
        if: matrix.os == 'windows-latest' && matrix.variant == 'direct' && vars.AZURE_SIGNING_READY == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0
        with:
          endpoint: https://weu.codesigning.azure.net/
          # The account is named for the product it was first created for; the
          # profile is named for the publisher, because one profile signs
          # everything the business ships. They are NOT the same string, and
          # that is the single easiest thing here to get wrong.
          signing-account-name: EasyPostDesktop
          certificate-profile-name: SpencerFieldsSoftware
          files-folder: ${{ github.workspace }}\dist\Dawnlist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Packaging comes AFTER signing, deliberately. Signing rewrites the
      # executable in place, so a ZIP or a checksum made beforehand describes a
      # file nobody will ever download. build_windows_direct.py enforces the
      # ordering itself: it refuses to package an unsigned exe unless told to.
      #
      # SIGNED repeats the signing step's condition as an expression rather
      # than as re-typed shell, because the two drifting apart is how this file
      # produced a green job and an unsigned ZIP under a release name. The
      # tests evaluate both and require them to agree in every scenario.
      - name: Package the Windows download
        if: matrix.os == 'windows-latest' && matrix.variant == 'direct'
        shell: bash
        env:
          SIGNED: ${{ vars.AZURE_SIGNING_READY == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
        run: |
          set -euo pipefail
          if [ "$SIGNED" = "true" ]; then
            # No --allow-unsigned: if the signing step above silently signed
            # nothing, the guard fails the build here rather than letting a
            # SmartScreen prompt find it on a stranger's machine.
            python packaging/build_windows_direct.py
          else
            # Signing did not run. Still build the package, so the guards run
            # on every push and the artefact can be smoke-tested — but say so
            # in the log and in the file name, because an unsigned ZIP is
            # indistinguishable from a signed one once it is downloaded.
            python packaging/build_windows_direct.py --allow-unsigned
            # The checksum goes, rather than being renamed alongside. A hash
            # published for an unsigned binary teaches buyers to verify
            # something that says nothing about where the file came from, and
            # a .sha256 sitting in an artefact is an invitation to publish it.
            rm -f dist/Dawnlist-windows-*.zip.sha256
            for f in dist/Dawnlist-windows-*.zip; do
              mv "$f" "dist/UNSIGNED-DO-NOT-PUBLISH-$(basename "$f")"
            done
          fi

      # -------------------------------------------------------------- artefacts
      - name: Upload
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: dawnlist-${{ matrix.os }}-${{ matrix.variant }}${{ steps.label.outputs.suffix }}
          # `error` only when a package is genuinely expected. Both Windows
          # legs always produce one; macOS produces a .dmg ONLY when it has
          # actually signed, because every other run stops after the guards.
          # Hard-coding `error` failed the first green macOS build for having
          # correctly produced nothing — the job had passed every real step.
          #
          # "Has secrets" WAS NOT THE SAME QUESTION AS "will sign", and reading
          # it as one failed every run on 2026-09-10. This expression repeats
          # EVERY clause gating the step that produces the .dmg — the secret,
          # the event, the branch and the input — and a test compares the two
          # by evaluating them rather than by reading them.
          if-no-files-found: ${{ (matrix.os == 'windows-latest' || (secrets.MACOS_CERTIFICATE_P12_BASE64 != '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && inputs.macos_direct)) && 'error' || 'warn' }}
          retention-days: 14
          path: |
            dist/*.msix
            dist/*.zip
            dist/*.sha256
            dist/*.dmg

  # ---------------------------------------------------------------------------
  # Mac App Store screenshots, rendered ON A MAC.
  #
  # WHY THIS CANNOT BE DONE ON THE DEVELOPER'S WINDOWS MACHINE. The renders grab
  # the widget rather than the window, so no title bar leaks — but the FONTS and
  # the CONTROL STYLING are the host platform's. Windows buttons and Segoe UI in
  # a Mac App Store listing are wrong in a way a reviewer can see, and Apple's
  # guideline 10.1.1 equivalent asks screenshots to show the app as it runs.
  #
  # WHY IT IS workflow_dispatch ONLY. macOS runners bill at 10x minutes. This is
  # free while the repository is public and would quietly dominate the allowance
  # if it ever went private again, so it never runs on push.
  #
  # 2560x1600 RATHER THAN 1440x900, and not merely for resolution. At 1440x900
  # the shortlist's "Why" column truncates — "Named target employer; travel and
  # lei..." — and those reasons are the entire point of that screenshot. The
  # larger size gives the table room as well as being the Retina variant.
  #
  # --size IS THE OUTPUT SIZE, not the logical one. Apple accepts ONLY 1280x800,
  # 1440x900, 2560x1600 and 2880x1800, exactly; render_store.py divides by the
  # runner's real device pixel ratio so the file lands on the requested pixels
  # whatever the machine. Hardcoding a logical size makes the output depend on
  # which machine rendered it, which is how a set ends up half one size.
  # ---------------------------------------------------------------------------
  screenshots:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      # Pillow comes from the lock like everything else. It used to be a bare
      # `pip install pillow` beside the requirements install: a second
      # dependency list that nothing checks and no hash covers.
      - name: Install dependencies
        run: pip install --require-hashes -r requirements.lock.txt

      - name: Render every captured locale
        run: |
          set -euo pipefail
          for loc in en de es fr hi ja zh; do
            python tools/render_store.py --locale "$loc" \
              --size 2560x1600 --out dist/mac-screenshots
          done

      # Apple rejects a set whose members are not all the declared size, and a
      # wrong size is invisible until upload. Fail here instead.
      - name: Every image must be exactly 2560x1600
        run: |
          python - <<'PY'
          import pathlib, sys
          from PIL import Image
          bad = []
          shots = sorted(pathlib.Path("dist/mac-screenshots").rglob("*.png"))
          for p in shots:
              if Image.open(p).size != (2560, 1600):
                  bad.append(f"{p} is {Image.open(p).size}")
          print(f"{len(shots)} image(s) checked")
          if bad:
              sys.exit("wrong size:\n  " + "\n  ".join(bad))
          if not shots:
              sys.exit("no screenshots were rendered")
          PY

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: mac-screenshots
          path: dist/mac-screenshots
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # The subscription's App Review screenshot — RENDERED, not captured.
  #
  # The subscription cannot leave MISSING_METADATA without a screenshot of the
  # screen a customer buys on. Capturing one is blocked on any machine nobody
  # is sitting at: macOS will not let anything read the display without Screen
  # Recording permission, that permission can only be granted by a human in
  # System Settings, `screencapture` over SSH fails with "could not create
  # image from display", and SIP puts the TCC database out of reach. Qt paints
  # the widget into a pixmap instead — no display, no permission.
  #
  # IT MUST RUN ON macOS. The point is macOS fonts and control styling; a
  # Windows render is a picture of a Mac app that visibly is not one.
  # ---------------------------------------------------------------------------
  review-screenshot:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.lock.txt

      # The price must match App Store Connect for the storefront the reviewer
      # sees — USA, $79.00. A screenshot showing a price the App Store does not
      # charge is a rejection.
      - name: Render the purchase screen
        run: python tools/render_subscribe.py --price '$79.00' --out dist/review

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: subscription-review
          path: dist/review/*.png
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Mac App Store .pkg — built, signed and uploaded to App Store Connect.
  #
  # A NO-OP UNTIL MAS_CERTIFICATE_P12_BASE64 EXISTS, so adding this changed
  # nothing until the secret was set. That is deliberate: the certificates are
  # team-wide and already exist (Apple Distribution + 3rd Party Mac Developer
  # Installer, both valid to Aug 2027), and the .p12 holding their private keys
  # was exported off the cloud Mac before it was given up. Only the profile is
  # app-specific, and Dawnlist's is already a secret.
  #
  # THIS JOB UPLOADS TO THE REAL APP STORE, so it is master-only at the job
  # level as well as at the step, and it runs the tests first by depending on
  # the build matrix. It also names an ENVIRONMENT, because a condition in this
  # file is only as trustworthy as this file: anyone who can push a branch can
  # edit it, and a branch restriction or a required reviewer on the `app-store`
  # environment is enforced by GitHub instead. See the runbook — the
  # environment has to be created there, not here.
  #
  # CFBundleVersion COMES FROM THE RUN NUMBER because App Store Connect refuses
  # an upload whose build number it has seen before, even for an identical
  # marketing version. The run number only ever increases.
  # ---------------------------------------------------------------------------
  mas:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    # The Worker tests, and the matrix with its own `python -m pytest`. This
    # job used to run neither: it built, signed and uploaded to App Store
    # Connect without one test having run in the same workflow.
    needs: [worker, build]
    environment: app-store
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      # PyInstaller is in requirements-dev.txt and therefore in this lock. It
      # used to be installed by hand here, unpinned and unhashed, in the job
      # that signs with the Apple Distribution certificate.
      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.lock.txt

      - name: Build, sign and upload the Mac App Store package
        if: env.HAS_MAS_SIGNING == 'true' && github.ref == 'refs/heads/master'
        env:
          HAS_MAS_SIGNING: ${{ secrets.MAS_CERTIFICATE_P12_BASE64 != '' }}
          MAS_CERTIFICATE_P12_BASE64: ${{ secrets.MAS_CERTIFICATE_P12_BASE64 }}
          MAS_INSTALLER_P12_BASE64: ${{ secrets.MAS_INSTALLER_P12_BASE64 }}
          MAS_CERTIFICATE_PASSWORD: ${{ secrets.MAS_CERTIFICATE_PASSWORD }}
          MAS_PROVISION_PROFILE_BASE64: ${{ secrets.MAS_PROVISION_PROFILE_BASE64 }}
          SIGN_APP_IDENTITY: ${{ secrets.MAS_SIGN_APP_IDENTITY }}
          SIGN_INSTALLER_IDENTITY: ${{ secrets.MAS_SIGN_INSTALLER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DAWNLIST_BUILD: ${{ github.run_number }}
        run: |
          set -euo pipefail

          # A throwaway keychain. It dies with the runner, but list-keychains
          # must still name it or codesign cannot see the identities.
          KEYCHAIN="$RUNNER_TEMP/mas.keychain"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          # The app (Apple Distribution) and installer (3rd Party Mac Developer
          # Installer) identities ship as SEPARATE single-identity p12s, both
          # under MAS_CERTIFICATE_PASSWORD. A single combined p12 built off a Mac
          # collapses to ONE identity on `security import` — OpenSSL gives both
          # key/cert pairs the same localKeyID — which on 2026-09-09 left
          # productbuild with no installer identity ("1 identity imported").
          echo "$MAS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/mas.p12"
          security import "$RUNNER_TEMP/mas.p12" -k "$KEYCHAIN" \
            -P "$MAS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          echo "$MAS_INSTALLER_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/mas-installer.p12"
          security import "$RUNNER_TEMP/mas-installer.p12" -k "$KEYCHAIN" \
            -P "$MAS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          # Prove both identities are usable before the long build; a bare count
          # would have caught the 2026-09-09 failure in seconds.
          security find-identity -v -p codesigning "$KEYCHAIN"
          security find-identity -v "$KEYCHAIN" | grep -q "3rd Party Mac Developer Installer" \
            || { echo "installer identity missing from keychain"; exit 1; }
          rm -f "$RUNNER_TEMP/mas.p12" "$RUNNER_TEMP/mas-installer.p12"

          # build_macos.py embeds this BEFORE signing; dropping it in afterwards
          # invalidates the seal and fails at upload naming neither.
          echo "$MAS_PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.provisionprofile"
          export PROVISION_PROFILE="$RUNNER_TEMP/app.provisionprofile"

          python tools/set_build_variant.py mas
          python -m PyInstaller packaging/build_exe.spec --noconfirm
          python packaging/build_macos.py --variant mas \
            --identity "$SIGN_APP_IDENTITY" \
            --installer-identity "$SIGN_INSTALLER_IDENTITY"

          PKG="$(ls dist/*.pkg | head -1)"
          echo "uploading $PKG"
          xcrun altool --upload-app -f "$PKG" -t macos \
            -u "$APPLE_ID" -p "$APPLE_APP_PASSWORD"

          security delete-keychain "$KEYCHAIN"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        if: always()
        with:
          name: mas-pkg
          path: dist/*.pkg
          if-no-files-found: warn
