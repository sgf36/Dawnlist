name: Build

# Windows and macOS packages, built on GitHub's runners.
#
# THIS IS THE ANSWER TO "macOS CANNOT BE BUILT FROM SPENCER'S MACHINE".
# It cannot — PyInstaller does not cross-compile — but it does not have to be
# built there. `macos-latest` is a real Mac, and Easy-Post Desktop has shipped
# to both the Mac App Store and Developer ID this way since August 2026. This
# workflow is modelled on that one, including the lessons its comments record.
#
# WHAT IT DELIBERATELY DOES NOT DO: duplicate the packaging logic in YAML.
# Signing, notarising and the two bundle guards live in
# `packaging/build_macos.py`, so they can be read, reviewed and run by hand on
# a Mac. A workflow that reimplements them in bash is a second source of truth
# that drifts, and it can only be tested by pushing.
#
# The macOS job runs WITHOUT signing secrets too. It still builds the .app and
# still runs the guards, so a broken bundle is caught on every push even before
# any certificate exists. Only the signing and upload steps are skipped.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant"
        required: false
        default: store
        type: choice
        options: [store, direct, mas]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # GitHub's default is six hours, which is far longer than anything here
    # should legitimately take.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      # Tests first. A package built from code that does not pass its own
      # tests is not worth signing.
      - name: Run tests
        run: python -m pytest -q

      - name: Select the build variant
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            VARIANT="${{ inputs.variant || 'mas' }}"
            [ "$VARIANT" = "store" ] && VARIANT="mas"
          else
            VARIANT="${{ inputs.variant || 'store' }}"
            [ "$VARIANT" = "mas" ] && VARIANT="store"
          fi
          echo "Building the $VARIANT variant"
          python tools/set_build_variant.py "$VARIANT"
          echo "VARIANT=$VARIANT" >> "$GITHUB_ENV"

      - name: Build with PyInstaller
        run: python -m PyInstaller packaging/build_exe.spec --noconfirm

      # ---------------------------------------------------------------- macOS
      - name: Import the signing certificate
        if: matrix.os == 'macos-latest' && env.HAS_SIGNING == 'true' && github.event_name != 'pull_request'
        env:
          HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          # A throwaway keychain, not the login one. It dies with the runner.
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          # Without this, codesign blocks on a GUI prompt no-one can answer.
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Store the notarisation credentials
        if: matrix.os == 'macos-latest' && env.HAS_NOTARY == 'true' && github.event_name != 'pull_request' && env.VARIANT == 'direct'
        env:
          HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials dawnlist \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"

      # Runs with or without secrets. Without them the guards still execute,
      # so a bundle missing its locale catalogues or carrying the wrong variant
      # flag fails here rather than at submission.
      - name: Verify the bundle
        if: matrix.os == 'macos-latest'
        run: python packaging/build_macos.py --variant "$VARIANT" --verify-only

      - name: Sign, package and notarise (macOS)
        if: matrix.os == 'macos-latest' && env.HAS_SIGNING == 'true' && github.event_name != 'pull_request'
        # Hard ceiling. Apple normally answers in minutes; the sibling project
        # once sat here for 1h58m against a dead runner network.
        timeout-minutes: 45
        env:
          HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.MAS_SIGN_INSTALLER_IDENTITY }}
        run: |
          set -euo pipefail
          if [ "$VARIANT" = "mas" ]; then
            # App Review notarises store builds, so this must NOT notarise.
            python packaging/build_macos.py --variant mas \
              --identity "$IDENTITY" \
              --installer-identity "$INSTALLER_IDENTITY"
          else
            python packaging/build_macos.py --variant direct \
              --identity "$IDENTITY" \
              --notary-profile dawnlist
          fi

      # -------------------------------------------------------------- Windows
      - name: Build the MSIX
        if: matrix.os == 'windows-latest'
        run: python packaging/build_msix.py

      # -------------------------------------------------------------- artefacts
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: dawnlist-${{ matrix.os }}-${{ env.VARIANT }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.msix
            dist/*.dmg
            dist/*.pkg
